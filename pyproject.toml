[project]
name = "finflow"
version = "0.1.0"
description = "Local-first financial data engineering reference implementation (synthetic data only)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
# Exact pins: the lockfile (uv.lock) pins transitive dependencies too.
# See docs/adr/0009-dependency-pinning.md for how these versions were chosen.
dependencies = [
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "duckdb==2.0.1",
    "pandera==0.36.0",
    "faker==40.63.0",
    "sqlalchemy==2.1.9",
    "psycopg[binary]==3.3.9",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.scripts]
finflow = "finflow.cli.main:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pandas-stubs==3.1.0.261029",
]
notebooks = ["jupyterlab", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finflow"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003", "PT018"]

[tool.mypy]
python_version = "3.12"
files = ["src/finflow"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Third-party deprecation emitted by FastAPI's TestClient import; not actionable here.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
markers = [
    "integration: runs the full lightweight pipeline on the local filesystem and DuckDB",
    "services: needs the Docker Compose data services (PostgreSQL, MinIO, FastAPI)",
]

[tool.coverage.run]
source = ["finflow"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
