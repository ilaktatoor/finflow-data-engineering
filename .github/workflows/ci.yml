name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans the full history

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Lint and format check
        run: |
          uv run ruff check src tests airflow scripts
          uv run ruff format --check src tests airflow scripts

      - name: Type check
        run: uv run mypy

      - name: Unit, contract and lightweight integration tests with coverage
        run: uv run pytest -m "not services" --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

      - name: End-to-end lightweight demo
        run: uv run finflow demo --incremental 1

  services:
    # Integration tests against real PostgreSQL, MinIO and the FastAPI simulator.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - name: Start data services
        run: |
          cp .env.example .env
          mkdir -p data/landing
          docker compose --profile data up -d --build --wait
      - name: Service tests
        run: FINFLOW_TEST_SERVICES=1 uv run pytest -m services
      - name: Service logs on failure
        if: failure()
        run: docker compose --profile data logs --tail=200
      - name: Stop services
        if: always()
        run: docker compose --profile data down -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
